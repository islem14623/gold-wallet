name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - name: Install packages
        run: pip install -r backend/requirements-dev.txt
      - name: Run tests
        working-directory: backend
        run: pytest

  build:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: false
          tags: gold-wallet-backend:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

  integration:
    runs-on: ubuntu-latestdocker compose up -d --wait db redis backend nginxdocker compose up -d --wait db redis backend nginx
    needs: build
    steps:
      - uses: actions/checkout@v4
      - name: Create .env for CI
        run: |
          cat > .env <<EOF
          POSTGRES_USER=gold
          POSTGRES_PASSWORD=$(openssl rand -hex 16)
          POSTGRES_DB=goldwallet
          REDIS_PASSWORD=$(openssl rand -hex 16)
          JWT_SECRET=$(openssl rand -hex 32)
          EOF
      - name: run database migrations
        run: docker compose run --rm migrate    
      - name: Start the stack
        run: docker compose up -d --build --wait db redis backend nginx
      - name: Run API tests
        run: ./test-api.sh
      - name: Show logs on failure
        if: failure()
        run: docker compose logs --tail 50
